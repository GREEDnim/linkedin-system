version: '3.8'

services:

  # ─────────────────────────────────────────
  # MYSQL — User, Post, Job databases
  # ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - linkedin-network

  # ─────────────────────────────────────────
  # REDIS — Feed cache + Rate limiting
  # ─────────────────────────────────────────
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - linkedin-network

  # ─────────────────────────────────────────
  # ELASTICSEARCH — Search
  # ─────────────────────────────────────────
  elasticsearch:
    # Must match the elasticsearch-java client managed by Spring Boot: Boot 4.1.2
    # brings spring-data-elasticsearch 6.1.2 -> elasticsearch-java 9.4.8, and a 9.x
    # client refuses to talk to an 8.x server ("Accept version must be either
    # version 8 or 7, but found 9"). Keep these versions in step.
    image: elasticsearch:9.4.8
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - linkedin-network

  # ─────────────────────────────────────────
  # Kafka, KRaft
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - linkedin-network

volumes:
  mysql-data:
  elasticsearch-data:

networks:
  linkedin-network:
    driver: bridge
