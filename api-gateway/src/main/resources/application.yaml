spring:
  application:
    name: api-gateway
  data:
    redis:
      # Shared across gateway instances, so the request budget is a property of the client
      # rather than of whichever process answered.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        # Spring Cloud Gateway's servlet flavour (5.x). Route prefix confirmed
        # against spring-cloud-gateway-server-webmvc-5.0.4: routes live under
        # spring.cloud.gateway.server.webmvc, not the reactive spring.cloud.gateway.
        webmvc:
          routes:
            # One entry per owning service. Every URI is overridable so the same
            # configuration works in compose (service names) and locally.
            #
            # 127.0.0.1 rather than localhost on purpose: the services bind loopback
            # (server.address), and on a dual-stack machine localhost can resolve to ::1
            # and reach an unrelated process that happens to own the wildcard port.
            - id: user-service
              uri: ${USER_SERVICE_URI:http://127.0.0.1:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
            - id: post-service
              uri: ${POST_SERVICE_URI:http://127.0.0.1:8082}
              predicates:
                - Path=/api/v1/posts/**
            - id: feed-service
              uri: ${FEED_SERVICE_URI:http://127.0.0.1:8083}
              predicates:
                - Path=/api/v1/feed/**
            - id: search-service
              uri: ${SEARCH_SERVICE_URI:http://127.0.0.1:8084}
              predicates:
                - Path=/api/v1/search/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:http://127.0.0.1:8085}
              predicates:
                - Path=/api/v1/notifications/**

server:
  # The single entry point. Every service keeps its own port, but only this one
  # should be exposed publicly.
  port: 8080

jwt:
  # Must be the SAME value user-service signs with, or every request is rejected.
  # Base64: decoded and used as an HS256 key (needs >= 32 bytes).
  secret: ${JWT_SECRET:39NCVLkAJG+XR67PxwWkgP+P8fhYglztTCX/HMoOgPI=}
  # Must match jwt.issuer in user-service; a token from anyone else is rejected even if it
  # happens to carry a valid signature.
  issuer: ${JWT_ISSUER:user-service}

gateway:
  cors:
    # Exact origins, for development. A wildcard would let any site call the API with a
    # user's token, and browsers refuse wildcard-plus-credentials anyway.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081,http://localhost:19006}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Per client IP per minute. The auth budget is the one that matters: it is what stops
    # /auth/login being used for unlimited password guessing. Twenty leaves room for a real
    # login flow plus a test run (scripts/e2e.sh makes nine auth calls) while still making
    # online guessing impractical; tighten it for a public deployment.
    auth-requests-per-minute: ${RATE_LIMIT_AUTH:20}
    api-requests-per-minute: ${RATE_LIMIT_API:600}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.linkedin.apigateway: INFO
    org.springframework.cloud.gateway: INFO
