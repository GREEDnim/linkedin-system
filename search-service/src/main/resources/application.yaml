server:
  port: 8084
  address: ${SERVER_ADDRESS:127.0.0.1}
  # Loopback only: the gateway is the single entry point, and every service trusts the
  # X-User-Id header that only the gateway is allowed to set. Binding 0.0.0.0 would let
  # anyone on the network reach a service directly and forge that header. In a container
  # deployment set SERVER_ADDRESS=0.0.0.0 so the gateway can still reach them.

spring:
  application:
    name: search-service

  # The 9.x client managed by Boot refuses to talk to an 8.x server, so the
  # docker-compose image must stay in step with spring-data-elasticsearch.
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 10s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Only used by the dead-letter recoverer: it republishes failed records to <topic>.DLT.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: search-service
      # Replay retained events on a fresh group so a brand-new index backfills
      # itself from topic history instead of starting empty.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapper so a single poison record cannot wedge the partition; the real
      # deserializer is the delegate below.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # Events are produced without type headers on purpose: the JSON body is the
        # contract, and each @KafkaListener declares its own target type.
        spring.json.use.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
